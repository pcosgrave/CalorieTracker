name: Deploy Android Prod

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Deploy Backend Prod
    types:
      - completed

permissions:
  contents: write
  id-token: write

jobs:
  guard:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_run'
    steps:
      - name: Ensure the backend deployment succeeded on prod
        run: |
          if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
            echo "The backend production deployment did not succeed."
            exit 1
          fi
          if [ "${{ github.event.workflow_run.head_branch }}" != "dev" ]; then
            echo "The backend deployment was not triggered by the expected dev -> prod promotion. Branch: ${{ github.event.workflow_run.head_branch }}"
            exit 1
          fi

  deploy:
    needs: guard
    if: always() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && needs.guard.result == 'success'))
    uses: ./.github/workflows/_deploy-mobile-and-infra.yml
    with:
      github_environment: prod
      terraform_environment: prod
      deploy_infrastructure: false
      android_flavor: prod
      android_package_name: com.cosgravelabs.bitewise
      play_track: production
      play_status: completed
      bump_release_version: true
      create_release_tag: true
      release_tag_prefix: android-prod
    secrets: inherit

