name: Deploy Prod

on:
  workflow_dispatch:
  push:
    branches:
      - prod

permissions:
  contents: write
  id-token: write

jobs:
  backend:
    name: Deploy production backend
    uses: ./.github/workflows/_deploy-backend-and-infra.yml
    with:
      github_environment: prod
      terraform_environment: prod
    secrets: inherit

  android:
    name: Publish production Android build
    needs: backend
    uses: ./.github/workflows/_deploy-mobile-and-infra.yml
    with:
      github_environment: prod
      terraform_environment: prod
      deploy_infrastructure: false
      android_flavor: prod
      android_package_name: com.cosgravelabs.bitewise
      play_track: production
      play_status: completed
      bump_release_version: true
      create_release_tag: true
      release_tag_prefix: android-prod
    secrets: inherit
