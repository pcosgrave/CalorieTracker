name: Reusable Backend And Infra Destroy

on:
  workflow_call:
    inputs:
      github_environment:
        required: true
        type: string
      terraform_environment:
        required: true
        type: string
      checkout_ref:
        required: false
        type: string
        default: ""
      terraform_state_key:
        required: false
        type: string
        default: ""
      app_environment_name:
        required: false
        type: string
        default: ""
      cognito_domain_prefix:
        required: false
        type: string
        default: ""

jobs:
  destroy:
    name: Destroy Backend ${{ inputs.github_environment }}
    runs-on: windows-latest
    environment: ${{ inputs.github_environment }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.checkout_ref != '' && inputs.checkout_ref || github.event.pull_request.base.ref || github.ref_name }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Restore Terraform plugin cache
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\terraform.d\plugin-cache
          key: ${{ runner.os }}-terraform-${{ hashFiles('infra/terraform/environments/**/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-terraform-

      - name: Prepare Terraform backend and variables
        shell: pwsh
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          TF_LOCK_TABLE: ${{ secrets.TF_LOCK_TABLE }}
          TF_STATE_KEY: ${{ vars.TF_STATE_KEY }}
          TF_APP_NAME: ${{ vars.TF_APP_NAME }}
          TF_COGNITO_DOMAIN_PREFIX: ${{ vars.TF_COGNITO_DOMAIN_PREFIX }}
          TF_COGNITO_DOMAIN_PREFIX_OVERRIDE: ${{ inputs.cognito_domain_prefix }}
          TF_STATE_KEY_OVERRIDE: ${{ inputs.terraform_state_key }}
          TF_APP_ENVIRONMENT_OVERRIDE: ${{ inputs.app_environment_name }}
          TF_WEB_CALLBACK_URL: ${{ vars.TF_WEB_CALLBACK_URL }}
          TF_WEB_LOGOUT_URL: ${{ vars.TF_WEB_LOGOUT_URL }}
          TF_GOOGLE_CLIENT_ID: ${{ vars.TF_GOOGLE_CLIENT_ID }}
          TF_GOOGLE_CLIENT_SECRET: ${{ secrets.TF_GOOGLE_CLIENT_SECRET }}
          TF_GOOGLE_AUTHORIZE_SCOPES: ${{ vars.TF_GOOGLE_AUTHORIZE_SCOPES }}
          TF_LOG_RETENTION_DAYS: ${{ vars.TF_LOG_RETENTION_DAYS }}
          TF_GEMINI_API_SECRET_ARN: ${{ secrets.TF_VAR_GEMINI_API_SECRET_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          $tfDir = Join-Path $PWD "infra/terraform/environments/${{ inputs.terraform_environment }}"
          $backendPath = Join-Path $tfDir "backend.ci.hcl"
          $tfvarsPath = Join-Path $tfDir "ci.auto.tfvars"
          $effectiveEnvironment = if ($env:TF_APP_ENVIRONMENT_OVERRIDE) { $env:TF_APP_ENVIRONMENT_OVERRIDE } else { "${{ inputs.terraform_environment }}" }
          $effectiveCognitoDomainPrefix = if ($env:TF_COGNITO_DOMAIN_PREFIX_OVERRIDE) { $env:TF_COGNITO_DOMAIN_PREFIX_OVERRIDE } else { $env:TF_COGNITO_DOMAIN_PREFIX }
          $stateKey = if ($env:TF_STATE_KEY_OVERRIDE) { $env:TF_STATE_KEY_OVERRIDE } elseif ($env:TF_STATE_KEY) { $env:TF_STATE_KEY } else { "$env:TF_APP_NAME/$effectiveEnvironment/terraform.tfstate" }

          @"
          bucket = "$env:TF_STATE_BUCKET"
          key    = "$stateKey"
          region = "$env:AWS_REGION"
          dynamodb_table = "$env:TF_LOCK_TABLE"
          encrypt = true
          "@ | Set-Content -Path $backendPath -Encoding utf8NoBOM

          $androidCallbacks = @(
            "bitewise-dev://auth/callback",
            "bitewise://auth/callback"
          )
          $androidLogouts = @(
            "bitewise-dev://signout",
            "bitewise://signout"
          )

          $lines = @(
            "aws_region = ""$env:AWS_REGION""",
            "app_name = ""$env:TF_APP_NAME""",
            "environment = ""$effectiveEnvironment""",
            "web_callback_urls = [""$env:TF_WEB_CALLBACK_URL""]",
            "web_logout_urls = [""$env:TF_WEB_LOGOUT_URL""]",
            "android_callback_urls = [" + (($androidCallbacks | ForEach-Object { """$_""" }) -join ", ") + "]",
            "android_logout_urls = [" + (($androidLogouts | ForEach-Object { """$_""" }) -join ", ") + "]",
            "cognito_domain_prefix = ""$effectiveCognitoDomainPrefix"""
          )

          if ($env:TF_GOOGLE_CLIENT_ID) {
            $lines += "google_client_id = ""$env:TF_GOOGLE_CLIENT_ID"""
          }
          if ($env:TF_GOOGLE_CLIENT_SECRET) {
            $lines += "google_client_secret = ""$env:TF_GOOGLE_CLIENT_SECRET"""
          }
          if ($env:TF_GOOGLE_AUTHORIZE_SCOPES) {
            $lines += "google_authorize_scopes = ""$env:TF_GOOGLE_AUTHORIZE_SCOPES"""
          }
          if ($env:TF_LOG_RETENTION_DAYS) {
            $lines += "log_retention_days = $env:TF_LOG_RETENTION_DAYS"
          }
          if ($env:TF_GEMINI_API_SECRET_ARN) {
            $lines += "gemini_api_secret_arn = ""$env:TF_GEMINI_API_SECRET_ARN"""
          }

          $lines | Set-Content -Path $tfvarsPath -Encoding utf8NoBOM

      - name: Build API Lambda package
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\scripts\build-api-dotnet-lambda.ps1

      - name: Terraform init
        shell: pwsh
        run: terraform -chdir=infra/terraform/environments/${{ inputs.terraform_environment }} init -backend-config="backend.ci.hcl"

      - name: Terraform destroy
        shell: pwsh
        run: terraform -chdir=infra/terraform/environments/${{ inputs.terraform_environment }} destroy -auto-approve -var-file="ci.auto.tfvars"
