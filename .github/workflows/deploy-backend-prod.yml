name: Deploy Backend Prod

on:
  workflow_dispatch:
  pull_request:
    branches:
      - prod
    types:
      - closed

permissions:
  contents: read
  id-token: write

jobs:
  guard:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Ensure this workflow runs for dev merged into prod
        run: |
          if [ "${{ github.event.pull_request.base.ref }}" != "prod" ]; then
            echo "This workflow must run for PRs merged into prod. Base branch: ${{ github.event.pull_request.base.ref }}"
            exit 1
          fi
          if [ "${{ github.event.pull_request.head.ref }}" != "dev" ]; then
            echo "This workflow only accepts dev -> prod merges. Head branch: ${{ github.event.pull_request.head.ref }}"
            exit 1
          fi

  deploy:
    needs: guard
    if: always() && (github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true) && (github.event_name != 'pull_request' || needs.guard.result == 'success')
    uses: ./.github/workflows/_deploy-backend-and-infra.yml
    with:
      github_environment: prod
      terraform_environment: prod
    secrets: inherit
